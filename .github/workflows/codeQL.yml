name: CodeQL

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: "0 6 * * 1" # 每周一 06:00 UTC 运行一次

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        language: [ "javascript-typescript", "python", "go" ] # 按需保留

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}

      # 如果你的项目有专门的 build 步骤，可以在这里添加（例如：npm ci && npm run build）

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
